<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('관리자 로그인')}"></head>
<body class="login-page">
<main class="login-card">
    <p class="eyebrow">EMOTORY · ADMIN</p>
    <h1>이야기 작업실</h1>
    <p class="muted">관리자 비밀번호로 로그인해 동화를 제작하세요.</p>
    <p th:if="${error}" th:text="${error}" class="notice error" role="alert"></p>
    <form th:action="@{/admin/login}" method="post">
        <label for="password">관리자 비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">로그인</button>
    </form>
</main>
</body>
</html>
