<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('동화 초안 목록')}"></head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<main class="container">
    <p class="eyebrow">MY STORIES</p><h1>동화 초안</h1>
    <p class="muted">초안을 작성하고 검증한 뒤 공개하면 사용자 이야기 목록에 반영됩니다.</p>
    <section class="panel">
        <h2>새 이야기 시작하기</h2>
        <p th:if="${error}" th:text="${error}" class="notice error" role="alert"></p>
        <form th:action="@{/admin/stories}" method="post" class="inline-form">
            <label for="title">제목</label>
            <input id="title" name="title" maxlength="255" placeholder="새 동화의 제목 (나중에 입력해도 돼요)">
            <button type="submit">초안 만들기</button>
        </form>
    </section>
    <p th:if="${drafts.empty}" class="empty">아직 초안이 없어요. 첫 이야기를 만들어 보세요.</p>
    <div class="story-grid">
        <article th:each="draft : ${drafts.content}" class="panel story-card">
            <span class="badge" th:text="${draft.publishedStoryId == null ? '초안' : (draft.publishedRevision == draft.revision ? '공개본 생성됨' : '공개 후 수정됨')}"></span>
            <h2><a th:href="@{/admin/stories/{id}(id=${draft.id})}" th:text="${#strings.isEmpty(draft.title) ? '제목 없는 동화' : draft.title}"></a></h2>
            <p class="muted" th:text="'초안 #' + ${draft.id} + ' · 저장 버전 ' + ${draft.revision}"></p>
            <p class="muted" th:text="'최근 수정: ' + ${draft.updatedAt}"></p>
            <a th:href="@{/admin/stories/{id}(id=${draft.id})}" class="button secondary">이야기 편집</a>
        </article>
    </div>
    <nav class="pagination" aria-label="초안 목록 페이지">
        <a th:if="${drafts.hasPrevious()}" th:href="@{/admin/stories(page=${drafts.number - 1})}">이전</a>
        <span th:text="${drafts.number + 1} + ' 페이지'"></span>
        <a th:if="${drafts.hasNext()}" th:href="@{/admin/stories(page=${drafts.number + 1})}">다음</a>
    </nav>
</main>
</body>
</html>
