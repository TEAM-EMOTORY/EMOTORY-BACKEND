name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. gradlew 실행 권한
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 4. 빌드 (테스트 제외)
      - name: Build
        run: ./gradlew clean build -x test

      # 5. Docker Hub 로그인
      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 & push
      - name: Build & Push Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:${{ github.sha }} \
            .

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:${{ github.sha }}

      # 7. EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu

            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:latest
            
            # 기존 컨테이너 정리
            docker compose down || true

            # 컨테이너 재시작 (간단하고 안정적인 방식)
            docker compose up -d --remove-orphans