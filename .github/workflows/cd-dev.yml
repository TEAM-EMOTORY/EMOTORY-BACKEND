name: CD-DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. gradlew 실행 권한
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 4. 빌드
      - name: Build
        run: ./gradlew clean build -x test

      # 5. Docker Hub 로그인
      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 & push
      - name: Build & Push Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:dev \
            .

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:dev

      # 7. DEV 서버 배포
      - name: Deploy to DEV Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/emotory

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/emotory-backend:dev

            docker compose -p dev \
              --env-file .env.dev \
              -f docker-compose.dev.yml \
              down || true

            docker compose -p dev \
              --env-file .env.dev \
              -f docker-compose.dev.yml \
              up -d --remove-orphans