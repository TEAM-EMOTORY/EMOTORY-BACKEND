name: CI

# 언제 실행할지 정의
on:
  pull_request:        # PR 생성/수정 시 실행
  push:
    branches-ignore:
      - main           # main 브랜치 제외하고 push 시 실행

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub에서 제공하는 Ubuntu 환경에서 실행

    steps:
      # 현재 레포지토리 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17 환경 설정 (Spring Boot 실행을 위한 필수 환경)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 캐시 설정 (빌드 속도 향상)
      # → 의존성 다운로드 시간을 줄이기 위함
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches       # Gradle 라이브러리 캐시
            ~/.gradle/wrapper      # Gradle 실행 파일 캐시
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # gradlew 실행 권한 부여 (Linux 환경에서 필요)
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 프로젝트 빌드 + 테스트 실행 (CI 핵심 단계)
      # → 코드가 정상적으로 동작하는지 검증
      - name: Build with Test
        run: ./gradlew clean build